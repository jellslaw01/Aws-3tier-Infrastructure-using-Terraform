apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: http-01-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: dummy@example.com   # replace with your ACME contact email
    privateKeySecretRef:
      name: acme-private-key
    solvers:
      - http01:
          ingress:
            class: nginx
